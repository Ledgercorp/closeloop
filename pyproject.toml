[project]
name = "closeloop"
version = "0.4.0"
description = "Verified-resolution core for the CloseLoop Alexa+ hackathon project"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "mcp>=2.1,<3",
  "PyJWT>=2.13,<3",
  "psycopg[binary]>=3.2,<4",
  "SQLAlchemy>=2.0,<3",
]

[project.optional-dependencies]
test = [
  "pytest>=9,<10",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.vercel]
entrypoint = "main:app"

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
